<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:transparent;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

#playBtn{
    cursor:pointer;
    width:80px;
    transition:.3s;
}

#playBtn:hover{
    transform:scale(1.08);
}

#playBtn img{
    width:100%;
    display:block;
}

audio{
    display:none;
}

</style>
</head>

<body>

<div id="playBtn">
    <img src="play.png.png" alt="Play">
</div>

<audio id="audio" preload="auto" loop>
    <source src="musica.mp3.mp3" type="audio/mpeg">
</audio>

<script>

const boton=document.getElementById("playBtn");
const audio=document.getElementById("audio");

boton.addEventListener("click",()=>{

    if(audio.paused){
        audio.play();
    }else{
        audio.pause();
    }

});

</script>

</body>
</html>
