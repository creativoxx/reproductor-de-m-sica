<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:transparent;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

#contenedor{
    position:relative;
    width:100%;
    max-width:1200px;
}

#fondo{
    width:100%;
    display:block;
}

#playBtn{
    position:absolute;

    /* POSICIÓN DEL BOTÓN */
    top:58%;
    left:84%;

    transform:translate(-50%,-50%);
    cursor:pointer;

    width:80px;
    transition:.3s;
}

#playBtn:hover{
    transform:translate(-50%,-50%) scale(1.08);
}

#playBtn img{
    width:100%;
    display:block;
}

audio{
    display:none;
}

</style>
</head>

<body>

<div id="contenedor">

    <img id="fondo" src="banner.png" alt="Invitación">

    <div id="playBtn">
        <img src="play.png.png" alt="Play">
    </div>

</div>

<audio id="audio" preload="auto" loop>
    <source src="musica.mp3.mp3" type="audio/mpeg">
</audio>

<script>

const boton=document.getElementById("playBtn");
const audio=document.getElementById("audio");

boton.addEventListener("click",()=>{

    if(audio.paused){
        audio.play();
    }else{
        audio.pause();
    }

});

</script>

</body>
</html>
