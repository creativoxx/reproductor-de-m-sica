<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

:root{
    --tamano:70px;   /* Cambia este valor si quieres el botón más grande o más pequeño */
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:transparent;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    background:transparent;
}

#playBtn{
    width:var(--tamano);
    height:var(--tamano);
    cursor:pointer;
    user-select:none;
    transition:.25s;
}

#playBtn:hover{
    transform:scale(1.08);
}

#playBtn:active{
    transform:scale(.95);
}

#playBtn img{
    width:100%;
    height:100%;
    display:block;
    pointer-events:none;
}

audio{
    display:none;
}

</style>

</head>

<body>

<div id="playBtn">
    <img src="play.png.png" alt="Play">
</div>

<audio id="audio" preload="auto" loop>
    <source src="musica.mp3.mp3" type="audio/mpeg">
</audio>

<script>

const boton=document.getElementById("playBtn");
const audio=document.getElementById("audio");

let activo=false;

boton.onclick=()=>{

    if(!activo){

        audio.play();

        activo=true;

    }else{

        audio.pause();

        audio.currentTime=0;

        activo=false;

    }

};

</script>

</body>
</html>
